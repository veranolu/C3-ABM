name: Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install numpy scipy
      
      # ============================================================
      # 核心修改点 1：在这里加命令行参数
      # ============================================================
      - name: Run baseline smoke test
        run: |
          python c3_abm.py --mode baseline --n_agents 25467 --seed 7 | tee smoke_output.txt
          
          # 防御性检查：确认脚本确实产生了输出
          if [ ! -s smoke_output.txt ]; then
            echo "ERROR: smoke_output.txt is empty"
            exit 1
          fi
      
      # ============================================================
      # 核心修改点 2：检查步骤不再重新跑脚本，而是读上面保存的文件
      # ============================================================
      - name: Verify headline values
        run: |
          python -c "
          import re, sys
          with open('smoke_output.txt') as f:
              text = f.read()
          
          # 提取 baseline 行的 CDI（兼容 +0.415 或 0.415 格式）
          # 如果你的输出格式是表格，这个正则足够用
          m = re.search(r'baseline.*?\t([+-]?[0-9.]+)\s*$', text, re.MULTILINE | re.IGNORECASE)
          if not m:
              # 备选：直接搜 CDI 字样
              m = re.search(r'CDI\s*[=:]\s*([+-]?[0-9.]+)', text)
          if not m:
              print('ERROR: CDI value not found in output')
              print('--- Output snippet ---')
              print(text[:1000])
              sys.exit(1)
          
          cdi = float(m.group(1))
          print(f'Found CDI = {cdi}')
          
          # 宽松断言：允许模拟噪声，范围 0.35 ~ 0.50
          assert 0.35 <= cdi <= 0.50, f'CDI {cdi} outside expected range [0.35, 0.50]'
          
          # 检查符号方向：rho 应为负，r 应为正
          has_rho_neg = bool(re.search(r'rho\s*[=:]\s*[-−][0-9.]+', text))
          has_r_pos   = bool(re.search(r'r_between|r\s*[=:]\s*\+[0-9.]+', text))
          
          if has_rho_neg and has_r_pos:
              print('PASS: Sign reversal confirmed')
          else:
              print('WARNING: Sign reversal not clearly detected in text')
          
          print('>>> Smoke test PASSED <<<')
          "
